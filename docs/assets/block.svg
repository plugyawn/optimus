<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 318" width="960" height="318" role="img" aria-labelledby="title">
<title id="title">Where an Optimus perturbation enters a decoder layer</title>
<rect width="960" height="318" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#52514e"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2a78d6"/></marker>
</defs><text x="24" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">One decoder layer, qv target preset</text><text x="22" y="194.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">x</text><path d="M34,190 H46" fill="none" stroke="#52514e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="48" y="164" width="84" height="52" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="90" y="194" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">RMSNorm</text><rect x="154" y="164" width="104" height="52" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="206" y="187" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">qkv_proj</text><text x="206" y="203" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">W·x</text><circle cx="291" cy="190" r="11" fill="#eef5fd" stroke="#2a78d6" stroke-width="1.25"/><path d="M286,190 H296 M291,185 V195" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/><rect x="324" y="164" width="128" height="52" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="388" y="187" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Attention</text><text x="388" y="203" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">KV cache per row</text><rect x="474" y="164" width="84" height="52" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="516" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">o_proj</text><circle cx="591" cy="190" r="11" fill="#ffffff" stroke="#52514e" stroke-width="1.25"/><path d="M586,190 H596 M591,185 V195" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/><rect x="624" y="164" width="84" height="52" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="666" y="194" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">RMSNorm</text><rect x="730" y="164" width="128" height="52" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="794" y="187" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">MLP</text><text x="794" y="203" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">gate · up → down</text><circle cx="891" cy="190" r="11" fill="#ffffff" stroke="#52514e" stroke-width="1.25"/><path d="M886,190 H896 M891,185 V195" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/><path d="M132,190 H152" fill="none" stroke="#52514e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M258,190 H278" fill="none" stroke="#52514e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M302,190 H322" fill="none" stroke="#52514e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M452,190 H472" fill="none" stroke="#52514e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M558,190 H578" fill="none" stroke="#52514e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M602,190 H622" fill="none" stroke="#52514e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M708,190 H728" fill="none" stroke="#52514e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M858,190 H878" fill="none" stroke="#52514e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M902,190 H924" fill="none" stroke="#52514e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="930" y="194.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">out</text><path d="M40,190 V248 H591 V203" fill="none" stroke="#52514e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M613,190 V254 H891 V203" fill="none" stroke="#52514e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="388" y="263" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">residual</text><rect x="113" y="52" width="136" height="50" rx="8" fill="#eef5fd" stroke="#2a78d6" stroke-width="1.25"/><text x="181" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">z = Q·x</text><text x="181" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">shared basis, rank r</text><rect x="271" y="52" width="230" height="50" rx="8" fill="#eef5fd" stroke="#2a78d6" stroke-width="1.25"/><text x="386" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">β·G<tspan font-size="0.75em" dy="0.3em">c</tspan><tspan dy="-0.3em"></tspan>·z</text><text x="386" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">per candidate, generated in-kernel</text><circle cx="143" cy="190" r="2.6" fill="#2a78d6"/><path d="M143,187 V104" fill="none" stroke="#2a78d6" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-accent)"/><path d="M249,77 H269" fill="none" stroke="#2a78d6" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-accent)"/><path d="M291,102 V177" fill="none" stroke="#2a78d6" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-accent)"/><text x="299" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#2a78d6" text-anchor="start">+δ on q, v</text><text x="24" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">y = W·x + β·G<tspan font-size="0.75em" dy="0.3em">c</tspan><tspan dy="-0.3em"></tspan>·Q·x</text><text x="206" y="302" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">c is the candidate that owns the row. Q is shared by every candidate; G is rebuilt from the seed, never stored.</text>
</svg>
