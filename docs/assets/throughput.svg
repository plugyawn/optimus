<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" height="310" role="img" aria-labelledby="title">
<title id="title">p128 replay throughput by perturbation backend</title>
<rect width="720" height="310" fill="#ffffff"/>
<text x="24" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="start">p128 replay throughput by perturbation backend</text><text x="24" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Candidates per second, higher is better. L40S 48GB, population 128, 8 prompts, rank 64 on q and v</text><rect x="24" y="71" width="10" height="10" rx="2" fill="#2a78d6"/><text x="40" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Optimus Triton kernels</text><rect x="207.2" y="71" width="10" height="10" rx="2" fill="#898781"/><text x="223.2" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">vLLM LoRA kernels, used as a bridge</text><path d="M268.5,96 V230" stroke="#c3c2b7" stroke-width="1"/><text x="268.5" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">0</text><path d="M361.5,96 V230" stroke="#e1e0d9" stroke-width="1"/><text x="361.5" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">4</text><path d="M454.5,96 V230" stroke="#e1e0d9" stroke-width="1"/><text x="454.5" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">8</text><path d="M547.5,96 V230" stroke="#e1e0d9" stroke-width="1"/><text x="547.5" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">12</text><path d="M640.5,96 V230" stroke="#e1e0d9" stroke-width="1"/><text x="640.5" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">16</text><text x="256" y="119" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="end">vLLM LoRA-kernel bridge</text><text x="256" y="134" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="end">candidate batch 16</text><path d="M269,112 H406.06 Q410.06,112 410.06,116 V126 Q410.06,130 406.06,130 H269 Z" fill="#898781"/><text x="418.06" y="125.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="start">6.1 cand/s</text><text x="256" y="161" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="end">Triton counter expand</text><text x="256" y="176" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="end">candidate batch 32</text><path d="M269,154 H552.81 Q556.81,154 556.81,158 V168 Q556.81,172 552.81,172 H269 Z" fill="#2a78d6"/><text x="564.81" y="167.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="start">12.4 cand/s</text><text x="256" y="203" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="end">Triton counter, in-place add</text><text x="256" y="218" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="end">candidate batch 64</text><path d="M269,196 H587.73 Q591.73,196 591.73,200 V210 Q591.73,214 587.73,214 H269 Z" fill="#2a78d6"/><text x="599.73" y="209.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="start">13.9 cand/s</text><text x="24" y="276" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start">Measured with a per-phase sync timer. With the host timer the in-place kernel runs at 16.6 cand/s.</text><text x="24" y="294" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start">Source: KERNEL.md, L40S end-to-end tables.</text>
</svg>
