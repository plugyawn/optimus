<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" width="960" height="412" role="img" aria-labelledby="title">
<title id="title">Optimus systems view: candidates batched inside vLLM</title>
<rect width="960" height="412" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#52514e"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2a78d6"/></marker>
</defs><text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#52514e" text-anchor="start">Search</text><text x="276" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#52514e" text-anchor="start">vLLM: one model copy, one continuous batch</text><text x="748" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#52514e" text-anchor="start">Selection</text><rect x="24" y="62" width="200" height="76" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="124" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Candidate panel</text><text x="124" y="106" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">seed, sign and scale β</text><text x="124" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">P = 128 to 4,096</text><rect x="24" y="178" width="200" height="76" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="124" y="206" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Activation bases Q</text><text x="124" y="222" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">one per site, from an SVD</text><text x="124" y="236" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">of calibration activations</text><rect x="260" y="48" width="448" height="330" rx="12" fill="#fafaf8" stroke="#e1e0d9" stroke-width="1"/><rect x="280" y="62" width="408" height="98" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="296" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">Scheduler</text><text x="296" y="101" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">prompts × candidates packed into one batch</text><rect x="296" y="116" width="18" height="18" rx="3" fill="#2a78d6"/><rect x="318" y="116" width="18" height="18" rx="3" fill="#2a78d6"/><text x="327" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#52514e" text-anchor="middle">c1</text><rect x="340" y="116" width="18" height="18" rx="3" fill="#2a78d6"/><rect x="362" y="116" width="18" height="18" rx="3" fill="#eb6834"/><rect x="384" y="116" width="18" height="18" rx="3" fill="#eb6834"/><text x="393" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#52514e" text-anchor="middle">c2</text><rect x="406" y="116" width="18" height="18" rx="3" fill="#eb6834"/><rect x="428" y="116" width="18" height="18" rx="3" fill="#1baf7a"/><rect x="450" y="116" width="18" height="18" rx="3" fill="#1baf7a"/><text x="459" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#52514e" text-anchor="middle">c3</text><rect x="472" y="116" width="18" height="18" rx="3" fill="#1baf7a"/><rect x="494" y="116" width="18" height="18" rx="3" fill="#eda100"/><rect x="516" y="116" width="18" height="18" rx="3" fill="#eda100"/><text x="525" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#52514e" text-anchor="middle">c4</text><rect x="538" y="116" width="18" height="18" rx="3" fill="#eda100"/><text x="568" y="129" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">row → candidate id</text><rect x="280" y="196" width="196" height="72" rx="8" fill="#eef5fd" stroke="#2a78d6" stroke-width="1.25"/><text x="378" y="222" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Lazy delta kernel</text><text x="378" y="238" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">Q·x, then G per row,</text><text x="378" y="252" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">added in place</text><rect x="492" y="196" width="196" height="72" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="590" y="222" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Base linears</text><text x="590" y="238" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">W·x, one GEMM</text><text x="590" y="252" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">shared by every row</text><rect x="280" y="302" width="408" height="56" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="484" y="327" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">KV cache</text><text x="484" y="343" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">kept per row; prefix cache off, because KV depends on the candidate</text><path d="M224,100 H278" fill="none" stroke="#52514e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M224,216 H278" fill="none" stroke="#2a78d6" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-accent)"/><path d="M378,160 V194" fill="none" stroke="#52514e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M590,160 V194" fill="none" stroke="#52514e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M378,268 V300" fill="none" stroke="#52514e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M590,268 V300" fill="none" stroke="#52514e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="748" y="62" width="188" height="60" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="842" y="89" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Scores</text><text x="842" y="105" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">per candidate, per prompt</text><rect x="748" y="158" width="188" height="60" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="842" y="185" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Top-K ensemble</text><text x="842" y="201" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">kept lazy: seeds, not weights</text><rect x="748" y="254" width="188" height="60" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="842" y="281" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Confirmation</text><text x="842" y="297" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">Transformers or LightEval</text><path d="M708,92 H746" fill="none" stroke="#52514e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="727" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#898781" text-anchor="middle">tokens</text><path d="M842,122 V156" fill="none" stroke="#52514e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M842,218 V252" fill="none" stroke="#52514e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="24" y="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Every candidate shares the base weights and their GEMMs; only the rank-r delta differs per row, and it is computed, not loaded.</text>
</svg>
