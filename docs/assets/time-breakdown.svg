<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 326" width="720" height="326" role="img" aria-labelledby="title">
<title id="title">Where p128 replay time goes on the vLLM LoRA-kernel bridge</title>
<rect width="720" height="326" fill="#ffffff"/>
<text x="24" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="start">Where p128 replay time goes on the vLLM LoRA-kernel bridge</text><text x="24" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">A100 80GB, population 128, rank 64 on q and v, 97.7 s total</text><rect x="24" y="71" width="10" height="10" rx="2" fill="#2a78d6"/><text x="40" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">perturbation path, 49.3 s (50%)</text><rect x="266.6" y="71" width="10" height="10" rx="2" fill="#898781"/><text x="282.6" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">everything else, 48.4 s</text><path d="M268.5,96 V264" stroke="#c3c2b7" stroke-width="1"/><text x="268.5" y="282" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">0 s</text><path d="M342.9,96 V264" stroke="#e1e0d9" stroke-width="1"/><text x="342.9" y="282" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">10 s</text><path d="M417.3,96 V264" stroke="#e1e0d9" stroke-width="1"/><text x="417.3" y="282" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">20 s</text><path d="M491.7,96 V264" stroke="#e1e0d9" stroke-width="1"/><text x="491.7" y="282" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">30 s</text><path d="M566.1,96 V264" stroke="#e1e0d9" stroke-width="1"/><text x="566.1" y="282" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">40 s</text><path d="M640.5,96 V264" stroke="#e1e0d9" stroke-width="1"/><text x="640.5" y="282" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">50 s</text><text x="256" y="120.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="end">Model rollout, scheduling, scoring</text><path d="M269,107 H623.87 Q627.87,107 627.87,111 V121 Q627.87,125 623.87,125 H269 Z" fill="#898781"/><text x="635.87" y="120.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="start">48.4 s</text><text x="256" y="152.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="end">vLLM LoRA kernels (shrink + expand)</text><path d="M269,139 H416.97 Q420.97,139 420.97,143 V153 Q420.97,157 416.97,157 H269 Z" fill="#2a78d6"/><text x="428.97" y="152.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="start">20.6 s</text><text x="256" y="184.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="end">Other hook work (dispatch, delta add)</text><path d="M269,171 H341.52 Q345.52,171 345.52,175 V185 Q345.52,189 341.52,189 H269 Z" fill="#2a78d6"/><text x="353.52" y="184.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="start">10.4 s</text><text x="256" y="216.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="end">Factor-stack construction</text><path d="M269,203 H339.44 Q343.44,203 343.44,207 V217 Q343.44,221 339.44,221 H269 Z" fill="#2a78d6"/><text x="351.44" y="216.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="start">10.1 s</text><text x="256" y="248.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="end">Row-candidate metadata</text><path d="M269,235 H325.16 Q329.16,235 329.16,239 V249 Q329.16,253 325.16,253 H269 Z" fill="#2a78d6"/><text x="337.16" y="248.5" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="start">8.2 s</text><text x="24" y="310" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start">Source: KERNEL.md, bridge p128 timing table.</text>
